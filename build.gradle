plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Masa"
		url = "https://masa.dy.fi/maven/sakura-ryoko"
		content {
			includeGroupAndSubgroups("fi.dy.masa")
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	// JOML 1.10.9 在 Java 25 上通过 sun.misc.Unsafe 缓存字段偏移，会打印终结弃用警告。
	// 关闭 Unsafe 路径，改用纯 Java 实现（性能影响可忽略）。
	runs.configureEach {
		jvmArguments.add("-Djoml.nounsafe=true")
	}

	mods {
		"tweakify-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// T1：重建真实 LevelChunk 的 server GameTest；`check`/`build` 会自动执行。
// 注意：runGameTest 不可缓存，每次 build 会启动真实服务端（本地约 20~30 秒）；
// 仅改文档或网络受限时可用 `./gradlew build -x runGameTest` 跳过。
// 这里只启用 server GameTest，不启用 client GameTest，因此不涉及 eula 配置。
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "tweakify-mod-test"
		enableGameTests = true
		enableClientGameTests = false
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu (client) - provides the mod list and calls our config-screen entrypoint.
	// compileOnly: only needed to implement the ModMenuApi interface.
	// 注：Loom 1.18 的 net.fabricmc.fabric-loom 插件已不再提供 modCompileOnly/modImplementation，
	// 依赖统一用标准 configuration，由插件自行处理 remap。
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// localRuntime: available when running the client in the dev environment, not bundled.
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// MaLiLib provides the Tweakeroo-style configuration GUI and widgets.
	implementation "maven.modrinth:GcWjdA9I:${project.malilib_version}"
	
	// MiniHUD is optional: only used by the optional MiniHUD mixin config.
	compileOnly("fi.dy.masa.minihud:minihud-fabric-26.3:${project.minihud_version}") {
		transitive = false
	}

	// Unit tests (Loom adds the Minecraft dependencies to the test source set automatically).
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// T4：Fabric Loader JUnit 在独立 loaderTest 源集运行，避免改变普通单测的注册表/tags 状态。
sourceSets {
	loaderTest {
		java.srcDir "src/loaderTest/java"
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.test.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.test.runtimeClasspath
	}
}

dependencies {
	// loaderTest 只引入 Fabric Loader JUnit；普通 test 环境保持不变。
	loaderTestImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

configurations {
	// 复用普通 test 的 JUnit 5.13.4 约束，避免 Fabric Loader JUnit 传递的旧版 launcher 触发额外下载。
	loaderTestImplementation.extendsFrom testImplementation
	loaderTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	loaderTestRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

tasks.register("loaderTest", Test) {
	testClassesDirs = sourceSets.loaderTest.output.classesDirs
	classpath = sourceSets.loaderTest.runtimeClasspath
	useJUnitPlatform()
	systemProperty "joml.nounsafe", "true"
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
	}
}

check.dependsOn loaderTest

test {
	useJUnitPlatform()
	systemProperty "joml.nounsafe", "true"
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// 显式固定源码编码：源码与语言文件含中文，避免构建者本地平台编码不同导致乱码。
	it.options.encoding = 'UTF-8'
	// -classfile 关闭第三方 jar 的类文件警告（gson/guava/joml 缺注解类），项目源码警告保持开启。
	it.options.compilerArgs += ['-Xlint:all,-processing,-serial,-this-escape,-classfile']
	// 主源集（main/client）的警告视为错误：新警告直接阻断构建，避免在增量提交里悄悄累积。
	// 测试/游戏测试源集暂不开启，避免测试代码里验证废弃 API 时被迫加抑制。
	if (it.name == 'compileJava' || it.name == 'compileClientJava') {
		it.options.compilerArgs += ['-Werror']
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
