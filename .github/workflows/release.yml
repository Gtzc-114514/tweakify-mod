# 推送 v* 标签时构建发布 jar，并创建对应的 GitHub Release。
# 触发条件与 build.yml 的 main push 分开：普通分支 push 不会走到这里。

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一标签的重复运行排队而不是互相取消：中断发布会留下未完成的 GitHub Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # 冷构建含 Minecraft/Fabric 依赖下载；超时即失败，不占用默认的 6 小时额度。
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # 缓存 Gradle 发行版、依赖与构建缓存；Minecraft/Fabric 依赖体积大，是 CI 的主要耗时。
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # build 已依赖 test：合并成一次调用，省掉一次 Gradle 启动与依赖解析。
      - name: build
        run: ./gradlew build
      - name: verify jar mod version
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No main jar found in build/libs"
            exit 1
          fi
          JAR_VERSION=$(unzip -p "$JAR" fabric.mod.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          GRADLE_VERSION=$(sed -n 's/^version=//p' gradle.properties | head -n 1)
          echo "jar=$JAR"
          echo "jar_version=$JAR_VERSION"
          echo "gradle_version=$GRADLE_VERSION"
          if [ "$JAR_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Version mismatch: fabric.mod.json=$JAR_VERSION gradle.properties=$GRADLE_VERSION"
            exit 1
          fi
      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
