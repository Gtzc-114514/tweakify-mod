# 推送 v* 标签时构建发布 jar，并创建对应的 GitHub Release。
# 触发条件与 build.yml 的 main push 分开：普通分支 push 不会走到这里。

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一标签的重复运行排队而不是互相取消：中断发布会留下未完成的 GitHub Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # 冷构建含 Minecraft/Fabric 依赖下载；超时即失败，不占用默认的 6 小时额度。
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # 缓存 Gradle 发行版、依赖与构建缓存；Minecraft/Fabric 依赖体积大，是 CI 的主要耗时。
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # 从 gradle.properties 解析版本，供下面两个校验步骤消费：去掉 CRLF 的 \r、允许行首与等号两侧空格、
      # 重复键取最后一个（与 Properties 的「后覆盖前」一致）。放在 build 与 unzip 之前：
      # 配置错误最先暴露，也避免两处复制同一段解析逻辑而漂移。
      - name: resolve mod version
        id: gv
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=$(tr -d '\r' < gradle.properties \
            | sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
            | tail -n 1)
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::gradle.properties 中未解析到版本：仅支持形如 version=1.0.1 的单行写法，不支持 ':' 或空白分隔、空值、行续接"
            exit 1
          fi
          echo "version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
      # 标签名去掉 v 前缀后必须与 gradle.properties 的 version 完全一致。
      # 现有 verify jar mod version 只比对 jar 与同一提交的 gradle.properties（两值恒等），
      # 拦不住「标签与产物版本不一致」；两步合起来保证 标签 = gradle.properties = jar 三者一致。
      - name: verify tag matches mod version
        shell: bash
        env:
          GRADLE_VERSION: ${{ steps.gv.outputs.version }}
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag_version=$TAG_VERSION"
          echo "gradle_version=$GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match gradle.properties version=${GRADLE_VERSION}"
            exit 1
          fi
      # build 已依赖 test：合并成一次调用，省掉一次 Gradle 启动与依赖解析。
      - name: build
        run: ./gradlew build
      - name: verify jar mod version
        shell: bash
        env:
          GRADLE_VERSION: ${{ steps.gv.outputs.version }}
        run: |
          set -euo pipefail
          # 先确认工具链完整（find/unzip/python3），避免把「镜像缺工具」误归因成「jar 内容问题」。
          for tool in find unzip python3; do
            command -v "$tool" >/dev/null \
              || { echo "::error::runner 镜像缺少 $tool，无法校验 jar 版本"; exit 1; }
          done
          # 区分「构建未产出目录」与「目录存在但无法枚举（权限/挂载）」：后者保留 stderr 便于排查。
          if [ ! -d build/libs ]; then
            echo "::error::build/libs 不存在或不是目录（build 步骤未产出，或路径被同名文件占用）"
            exit 1
          fi
          if ! JAR_LIST=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar'); then
            echo "::error::无法枚举 build/libs（目录存在但 find 失败，可能是权限或挂载问题）"
            exit 1
          fi
          # 纯 bash 参数展开取首行：无子进程，也不存在 SIGPIPE 面。
          JAR="${JAR_LIST%%$'\n'*}"
          if [ -z "$JAR" ]; then
            echo "::error::No main jar found in build/libs"
            exit 1
          fi
          # 三种失败都要有注解：jar 内没有 fabric.mod.json、缺 version 字段、jar 损坏。
          if ! JAR_VERSION=$(unzip -p "$JAR" fabric.mod.json 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null); then
            echo "::error::无法从 $JAR 读取 fabric.mod.json 的 version（文件缺失、jar 损坏或缺少 version 字段）"
            exit 1
          fi
          echo "jar=$JAR"
          echo "jar_version=$JAR_VERSION"
          echo "gradle_version=$GRADLE_VERSION"
          if [ "$JAR_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Version mismatch: fabric.mod.json=$JAR_VERSION gradle.properties=$GRADLE_VERSION"
            exit 1
          fi
      # 发布正文优先用 docs/release-notes/<tag>.md（纳入版本管理、可回溯）。
      # 该文件必须在打标签之前合入 main：tag 触发时 checkout 的是 tag 指向的提交，
      # 晚于 tag 提交的 notes 不会被看到。
      # 没有对应文件（或文件为空）时输出 warning 并回退到 GitHub 自动生成的 release notes。
      - name: resolve release notes
        id: notes
        shell: bash
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -s "$NOTES" ] && grep -q '[^[:space:]]' "$NOTES"; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未找到非空的 $NOTES，回退到自动生成的 release notes；notes 文件必须在打 tag 前提交"
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          fail_on_unmatched_files: true
